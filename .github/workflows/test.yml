name: Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:

# packages: read lets GITHUB_TOKEN install @moleculemaker packages from GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@moleculemaker'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx ng test --watch=false --browsers=ChromeHeadless
